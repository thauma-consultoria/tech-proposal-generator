# Dependências de sistema necessárias para o Chromium (Puppeteer) no Railway (Linux)
[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
aptPkgs = [
  "libnss3",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libxkbcommon0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libasound2t64",
  "libpango-1.0-0",
  "libpangocairo-1.0-0",
  "libgtk-3-0",
  "libx11-xcb1",
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
